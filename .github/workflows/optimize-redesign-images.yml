name: Optimize redesign images

on:
  push:
    branches: [main]
    paths:
      - 'redesign/scripts/optimize_images.py'
      - '.github/workflows/optimize-redesign-images.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image encoders
        run: python -m pip install Pillow pillow-avif-plugin
      - name: Generate responsive image files
        run: python redesign/scripts/optimize_images.py > /tmp/image-report.json
      - name: Commit generated image files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add redesign/img/optimized
          if git diff --cached --quiet; then
            echo 'Optimized image files are already current.'
          else
            git commit -m 'Optimize images for redesigned site'
            git push
          fi

